[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-ai-gateway"
version = "0.1.0"
description = "Production-oriented enterprise AI platform"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "redis>=5.0",
    "pydantic-settings>=2.0",
    "alembic>=1.14",
    "pydantic>=2.0",
    "openai>1.0",
    "tenacity>=9.0",
    "pgvector>=0.3",
    "pytest-asyncio>=0.25",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "redis>=5.0",
    "pydantic-settings>=2.0",
    "alembic>=1.14",
    "pydantic>=2.0",
    "openai>=1.0",
    "tenacity>=9.0",
    "pgvector>=0.3",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.setuptools.packages.find]
where = ["backend"]